version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bakery_postgres
    environment:
      POSTGRES_DB: bakery_db
      POSTGRES_USER: bakery_user
      POSTGRES_PASSWORD: bakery_pass
    ports:
      - '5432:5432'
    volumes:
      - bakery_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bakery_user -d bakery_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bakery_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bakery.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  bakery_postgres_data:
